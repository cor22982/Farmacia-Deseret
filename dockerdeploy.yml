services:
  # Backend con FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      MONGODB_URL: ${MONGO_URL}
      DATABASE_NAME: ${MONGO_DATABASE:-farmacia}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - app-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend con React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${BACKEND_URL:-http://localhost:8000}
    container_name: frontend
    restart: always
    environment:
      REACT_APP_API_URL: ${BACKEND_URL:-http://localhost:8000}
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./logs/backend:/logs
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true

volumes:
  backend_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
